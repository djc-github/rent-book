spring:
  application:
    name: RentBook
  profiles:
    active: prod
  config:
    import:
      - optional:classpath:/config/
      - optional:file:./src/main/resources/config/
      - optional:file:./config/
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    com.djc.rentbook: debug

rentbook:
  audit:
    retention-years: ${RENTBOOK_AUDIT_RETENTION_YEARS:3}
    cleanup-cron: "${RENTBOOK_AUDIT_CLEANUP_CRON:0 45 3 * * *}"
    zone: ${RENTBOOK_AUDIT_ZONE:Asia/Shanghai}
  idempotency:
    cleanup-cron: "0 30 3 * * *"
  lease-expire:
    cron: "0 10 0 * * *"
    zone: Asia/Shanghai
  rent-collect:
    advance-days: 7
  upload:
    base-dir: ./uploads
    public-path: /uploads
    max-room-images: 1
    max-file-size-mb: 5
    thumbnail-max-width: 480
