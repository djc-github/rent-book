<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小胡收租簿</title>
  <link rel="stylesheet" href="./assets/app.css?v=20260725-2">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">胡</span>
      <div>
        <strong>小胡收租簿</strong>
        <small>房态收租工作台</small>
      </div>
      <button class="mobile-refresh" id="mobileRefreshBtn" type="button" aria-label="刷新当前页面" title="刷新当前页面">刷新</button>
    </div>
    <nav class="nav" aria-label="主导航" data-active-view="dashboard">
      <button class="nav-item active" data-view="dashboard">总览</button>
      <button class="nav-item" data-view="properties">房态收租</button>
    </nav>
  </aside>

  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="pageHint">今天优先处理</p>
        <h1 id="pageTitle">总览</h1>
      </div>
      <div class="actions">
        <button class="ghost" id="refreshBtn">刷新</button>
        <button class="primary" id="propertyAddBtn" hidden>新增房源</button>
        <button class="primary" id="quickAddBtn">快速录入</button>
      </div>
    </header>

    <section id="toast" class="toast" hidden></section>
    <section id="content" class="content"></section>
  </main>

  <div id="propertyContext" class="mobile-property-context" hidden aria-hidden="true">
    <span id="propertyContextIndex"></span>
    <strong id="propertyContextLabel"></strong>
  </div>

  <nav id="propertyAlphabetIndex" class="property-alphabet-index" aria-label="房源首字母快捷定位" hidden aria-hidden="true"></nav>
  <div id="propertyAlphabetPreview" class="property-alphabet-preview" hidden aria-hidden="true"></div>

  <dialog id="modal" class="modal">
    <form class="modal-box" id="modalForm">
      <header>
        <h2 id="modalTitle">快速录入</h2>
        <button type="button" class="icon-btn" data-close-modal aria-label="关闭">×</button>
      </header>
      <p id="modalTip" class="modal-tip"></p>
      <div id="modalBody" class="form-grid"></div>
      <footer>
        <button type="button" class="ghost" data-close-modal>取消</button>
        <button type="submit" class="primary">保存</button>
      </footer>
    </form>
  </dialog>

  <dialog id="confirmDialog" class="confirm-modal">
    <form class="confirm-box" method="dialog">
      <header>
        <h2 id="confirmTitle">确认操作</h2>
        <button type="button" class="icon-btn" data-cancel-confirm aria-label="关闭">×</button>
      </header>
      <p id="confirmMessage" class="confirm-message"></p>
      <footer>
        <button type="button" class="ghost" data-cancel-confirm>取消</button>
        <button type="button" class="primary danger-confirm" id="confirmOkBtn">确认</button>
      </footer>
    </form>
  </dialog>

  <dialog id="dueDateDialog" class="modal due-date-modal">
    <form class="modal-box due-date-box" id="dueDateForm">
      <header>
        <div>
          <h2>调整下次应收日</h2>
          <small id="dueDateRoomLabel"></small>
        </div>
        <button type="button" class="icon-btn" data-close-due-date aria-label="关闭">×</button>
      </header>
      <div class="due-date-body">
        <div class="due-date-summary">
          <span><small>当前应收日</small><strong id="dueCurrentDate">-</strong></span>
          <span><small>最近已收至</small><strong id="dueLatestCoveredDate">-</strong></span>
        </div>

        <div class="field required">
          <label for="dueNewDate">新的应收日</label>
          <div class="due-date-input-row">
            <input id="dueNewDate" name="nextDueDate" type="date" required>
            <button id="dueRestoreDateBtn" class="ghost" type="button">恢复建议日期</button>
          </div>
        </div>

        <div id="dueDatePreview" class="due-date-preview" aria-live="polite"></div>

        <fieldset class="due-reason-group">
          <legend>调整原因</legend>
          <div class="due-reason-options">
            <label><input type="radio" name="reason" value="ENTRY_ERROR" required><span>录入错误</span></label>
            <label><input type="radio" name="reason" value="RENT_FREE_PERIOD"><span>免租期</span></label>
            <label><input type="radio" name="reason" value="SCHEDULE_CHANGE"><span>租期调整</span></label>
            <label><input type="radio" name="reason" value="OTHER"><span>其他</span></label>
          </div>
        </fieldset>

        <div class="field full">
          <label for="dueDateNotes">补充说明</label>
          <textarea id="dueDateNotes" name="notes" rows="2" maxlength="300" placeholder="选择“其他”时请填写"></textarea>
        </div>
      </div>
      <footer>
        <button type="button" class="ghost" data-close-due-date>取消</button>
        <button type="submit" class="primary" id="dueDateSubmitBtn">继续</button>
      </footer>
    </form>
  </dialog>

  <dialog id="imageDialog" class="modal image-modal">
    <form class="modal-box image-box" method="dialog">
      <header>
        <h2 id="imageTitle">房间图片</h2>
        <button type="button" class="icon-btn" data-close-image aria-label="关闭">×</button>
      </header>
      <div class="image-body">
        <label class="image-picker">
          <div id="imagePreview" class="image-preview"></div>
          <input id="roomImageInput" type="file" accept="image/jpeg,image/png,image/webp">
          <span class="image-picker-copy">
            <strong id="imagePickTitle">点这里选择图片</strong>
            <small id="imagePickHint">支持 JPG、PNG、WEBP，单张不超过 5MB</small>
          </span>
        </label>
        <p id="imagePendingNote" class="image-pending-note" hidden>已选好，点“保存图片”后会显示到房间卡片。</p>
      </div>
      <footer class="image-actions">
        <button type="button" class="ghost" data-close-image>取消</button>
        <button type="button" class="ghost danger-text" id="deleteImageBtn">删除图片</button>
        <button type="button" class="primary" id="uploadImageBtn">保存图片</button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="./assets/app.js?v=20260725-2"></script>
</body>
</html>
