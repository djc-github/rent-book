<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小胡收租簿</title>
  <link rel="stylesheet" href="./assets/app.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">胡</span>
      <div>
        <strong>小胡收租簿</strong>
        <small>房态收租工作台</small>
      </div>
    </div>
    <nav class="nav" aria-label="主导航">
      <button class="nav-item active" data-view="dashboard">总览</button>
      <button class="nav-item" data-view="properties">房态收租</button>
    </nav>
  </aside>

  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="pageHint">今天优先处理</p>
        <h1 id="pageTitle">总览</h1>
      </div>
      <div class="actions">
        <button class="ghost" id="refreshBtn">刷新</button>
        <button class="primary" id="quickAddBtn">快速录入</button>
      </div>
    </header>

    <section id="toast" class="toast" hidden></section>
    <section id="content" class="content"></section>
  </main>

  <dialog id="modal" class="modal">
    <form class="modal-box" id="modalForm">
      <header>
        <h2 id="modalTitle">快速录入</h2>
        <button type="button" class="icon-btn" data-close-modal aria-label="关闭">×</button>
      </header>
      <p id="modalTip" class="modal-tip"></p>
      <div id="modalBody" class="form-grid"></div>
      <footer>
        <button type="button" class="ghost" data-close-modal>取消</button>
        <button type="submit" class="primary">保存</button>
      </footer>
    </form>
  </dialog>

  <dialog id="confirmDialog" class="confirm-modal">
    <form class="confirm-box" method="dialog">
      <header>
        <h2 id="confirmTitle">确认操作</h2>
        <button type="button" class="icon-btn" data-cancel-confirm aria-label="关闭">×</button>
      </header>
      <p id="confirmMessage" class="confirm-message"></p>
      <footer>
        <button type="button" class="ghost" data-cancel-confirm>取消</button>
        <button type="button" class="primary danger-confirm" id="confirmOkBtn">确认</button>
      </footer>
    </form>
  </dialog>

  <dialog id="imageDialog" class="modal image-modal">
    <form class="modal-box image-box" method="dialog">
      <header>
        <h2 id="imageTitle">房间图片</h2>
        <button type="button" class="icon-btn" data-close-image aria-label="关闭">×</button>
      </header>
      <div class="image-body">
        <label class="image-picker">
          <div id="imagePreview" class="image-preview"></div>
          <input id="roomImageInput" type="file" accept="image/jpeg,image/png,image/webp">
          <span class="image-picker-copy">
            <strong id="imagePickTitle">点这里选择图片</strong>
            <small id="imagePickHint">支持 JPG、PNG、WEBP，单张不超过 5MB</small>
          </span>
        </label>
        <p id="imagePendingNote" class="image-pending-note" hidden>已选好，点“保存图片”后会显示到房间卡片。</p>
      </div>
      <footer class="image-actions">
        <button type="button" class="ghost" data-close-image>取消</button>
        <button type="button" class="ghost danger-text" id="deleteImageBtn">删除图片</button>
        <button type="button" class="primary" id="uploadImageBtn">保存图片</button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="./assets/app.js"></script>
</body>
</html>
